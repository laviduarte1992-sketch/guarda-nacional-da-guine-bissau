<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Operacional - Guarda Nacional</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #eef2f5; color: #333; }
        header { background-color: #1e3d2f; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-primary { background-color: #1e3d2f; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .btn-primary:hover { background-color: #14281f; }
        .btn-sair { background-color: #d9534f; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; font-size: 14px; }
    </style>
</head>
<body>

<header>
    <h2>Portal Interno | Guarda Nacional</h2>
    <div>
        <span id="userInfo">A carregar perfil...</span> | 
        <a href="#" onclick="logout()" class="btn-sair">Sair</a>
    </div>
</header>

<div class="container">
    <div class="card">
        <h3>Registo de Nova Ocorrência / Patrulhamento</h3>
        <form id="ocorrenciaForm">
            <div class="form-group">
                <label for="tipo">Tipo de Ocorrência</label>
                <input type="text" id="tipo" required placeholder="Ex: Patrulhamento urbano, Incidente, Fiscalização">
            </div>
            <div class="form-group">
                <label for="local">Localização</label>
                <input type="text" id="local" required placeholder="Ex: Bissau - Sector Central">
            </div>
            <div class="form-group">
                <label for="descricao">Descrição da Ocorrência</label>
                <textarea id="descricao" rows="4" required placeholder="Detalhes operacionais..."></textarea>
            </div>
            <button type="submit" class="btn-primary">Gravar no Banco de Dados</button>
        </form>
    </div>
</div>

<script>
    const SUPABASE_URL = 'COLE_AQUI_A_SUA_URL_DO_SUPABASE';
    const SUPABASE_ANON_KEY = 'COLE_AQUI_A_SUA_CHAVE_ANON_DO_SUPABASE';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Verificação de sessão
    const funcionario = JSON.parse(localStorage.getItem('funcionario_ativo'));
    if (!funcionario) {
        window.location.href = 'login.html';
    } else {
        document.getElementById('userInfo').textContent = `Agente: ${funcionario.nome_completo} (${funcionario.patente})`;
    }

    function logout() {
        localStorage.removeItem('funcionario_ativo');
        window.location.href = 'login.html';
    }

    // Gravação no Supabase
    document.getElementById('ocorrenciaForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const tipo = document.getElementById('tipo').value;
        const local = document.getElementById('local').value;
        const descricao = document.getElementById('descricao').value;

        const { data, error } = await supabaseClient
            .from('registos')
            .insert([
                { 
                    funcionario_id: funcionario.id, 
                    tipo_ocorrencia: tipo, 
                    localizacao: local, 
                    descricao: descricao 
                }
            ]);

        if (error) {
            alert('Erro ao gravar: ' + error.message);
        } else {
            alert('Ocorrência registada com sucesso!');
            document.getElementById('ocorrenciaForm').reset();
        }
    });
</script>

</body>
</html>
