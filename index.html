<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guarda Nacional da Guiné-Bissau - Site Oficial</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background-color: #f8f9fa; color: #333; line-height: 1.6; }
        
        /* Cabeçalho */
        header { background-color: #1e3d2f; color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-area h1 { font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
        nav { display: flex; align-items: center; gap: 20px; }
        nav a { color: white; text-decoration: none; font-weight: bold; font-size: 14px; transition: color 0.3s; }
        nav a:hover { color: #d1e7dd; }
        .btn-portal { background-color: #e6a100; color: #1e3d2f; padding: 8px 16px; border-radius: 4px; font-weight: bold; text-decoration: none; display: flex; align-items: center; gap: 5px; }
        .btn-portal:hover { background-color: #cca000; }

        /* Banner Principal com Brasão CENTRAL */
        .hero { 
            /* Fundo com as cores da Guiné-Bissau (padrão sutil) */
            background: #1e3d2f; 
            background-image: 
                linear-gradient(rgba(30, 61, 47, 0.95), rgba(30, 61, 47, 0.95)), /* Camada escura */
                linear-gradient(90deg, transparent 50%, rgba(206, 17, 38, 0.1) 50%), /* Vermelho */
                linear-gradient(rgba(252, 216, 0, 0.1) 50%, transparent 50%); /* Amarelo */
            background-size: 100%, 20px 20px, 20px 20px;
            color: white; 
            text-align: center; 
            padding: 120px 20px 100px 20px; /* Mais espaço no topo */
            position: relative;
        }

        /* O Símbolo/Brasão Central */
        .brasao-central {
            width: 150px; /* Tamanho do brasão */
            height: 150px;
            background-color: transparent;
            margin: 0 auto 30px auto; /* Centralizado horizontalmente */
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* SVG do Brasão (Simbólico) */
        .brasao-central svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .hero h2 { font-size: 36px; margin-bottom: 15px; }
        .hero p { font-size: 18px; max-width: 700px; margin: 0 auto 25px auto; }

        /* Secções Gerais */
        .section { padding: 60px 10%; background: white; margin-bottom: 20px; }
        .section-title { text-align: center; color: #1e3d2f; font-size: 26px; margin-bottom: 40px; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .card { background: #f4f6f9; padding: 25px; border-radius: 8px; border-top: 4px solid #1e3d2f; transition: transform 0.3s ease; }
        .card:hover { transform: translateY(-5px); }
        .card h3 { color: #1e3d2f; margin-bottom: 10px; }

        /* Rodapé */
        footer { background-color: #14281f; color: #aaa; text-align: center; padding: 25px; font-size: 14px; }
    </style>
</head>
<body>

<header>
    <div class="logo-area">
        <h1>Guarda Nacional | Guiné-Bissau</h1>
    </div>
    <nav>
        <a href="#inicio">Início</a>
        <a href="#sobre">Sobre Nós</a>
        <a href="#servicos">Serviços</a>
        <a href="#contactos">Contact
