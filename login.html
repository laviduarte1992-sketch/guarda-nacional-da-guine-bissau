<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Funcionário - Guarda Nacional</title>
    <!-- Biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; }
        .login-card h2 { text-align: center; color: #1e3d2f; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-submit { width: 100%; background-color: #1e3d2f; color: white; padding: 10px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        .btn-submit:hover { background-color: #14281f; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none; font-size: 14px; }
        .error-msg { color: #d9534f; font-size: 14px; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Área Restrita</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="matricula">Número de Matrícula</label>
            <input type="text" id="matricula" required placeholder="ex: GN-2026-001">
        </div>
        <button type="submit" class="btn-submit">Entrar no Sistema</button>
        <div id="errorMsg" class="error-msg"></div>
    </form>
    <a href="index.html" class="back-link">&larr; Voltar ao site principal</a>
</div>

<script>
    // Configuração do Supabase
    const SUPABASE_URL = 'SEU_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'SUA_SUPABASE_ANON_KEY';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const matricula = document.getElementById('matricula').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        errorMsg.textContent = 'A verificar matrícula...';

        // Consulta a tabela de funcionários no Supabase
        const { data, error } = await supabaseClient
            .from('funcionarios')
            .select('*')
            .eq('matricula', matricula)
            .single();

        if (error || !data) {
            errorMsg.textContent = 'Matrícula não encontrada no sistema.';
        } else {
            // Guarda as informações do funcionário no navegador e entra no painel
            localStorage.setItem('funcionario_ativo', JSON.stringify(data));
            window.location.href = 'painel.html';
        }
    });
</script>

</body>
</html>
