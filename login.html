<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Funcionário - Guarda Nacional</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; }
        .login-card h2 { text-align: center; color: #1e3d2f; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-submit { width: 100%; background-color: #1e3d2f; color: white; padding: 10px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        .btn-submit:hover { background-color: #14281f; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Área Restrita</h2>
    <form onsubmit="alert('Sistema pronto para ligação com a base de dados!'); return false;">
        <div class="form-group">
            <label for="email">E-mail Institucional ou Matrícula</label>
            <input type="text" id="email" name="email" required placeholder="ex: agente@guardanacional.gw">
        </div>
        <div class="form-group">
            <label for="senha">Palavra-passe</label>
            <input type="password" id="senha" name="senha" required placeholder="********">
        </div>
        <button type="submit" class="btn-submit">Entrar no Sistema</button>
    </form>
    <a href="index.html" class="back-link">&larr; Voltar ao site principal</a>
</div>

</body>
</html>
